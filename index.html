<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minh Luận Ba Ba Thật Giang</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .card {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 50px 60px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        h1 { font-size: 2.5rem; margin-bottom: 10px; }
        p { font-size: 1.1rem; opacity: 0.9; margin-top: 15px; }
        .emoji { font-size: 4rem; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="emoji">📚</div>
        <h1>Minh Luận Ba Ba Thật Giang</h1>
        <p>Chào mừng đến với trang của tôi!</p>
        <p>🌟 GitHub Pages đang hoạt động thành công!</p>
    </div>
</body>
</html>
